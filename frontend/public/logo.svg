<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7a68"/>
      <stop offset="55%" stop-color="#14967f"/>
      <stop offset="100%" stop-color="#1caf94"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eafaf5"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="120" cy="120" r="112" fill="url(#ring)"/>
  <!-- Inner disc -->
  <circle cx="120" cy="120" r="94" fill="url(#inner)" stroke="#0a3d36" stroke-width="2"/>

  <!-- Curved system name, top -->
  <path id="topArc" d="M 34 120 A 86 86 0 0 1 206 120" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="700" fill="#0a3d36" letter-spacing="2.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">STUDENT RECORDS SYSTEM</textPath>
  </text>

  <!-- Curved tagline, bottom -->
  <path id="bottomArc" d="M 46 152 A 86 86 0 0 0 194 152" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="600" fill="#0e7a68" letter-spacing="3.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">EST. 2024 · SIMS</textPath>
  </text>

  <!-- Small dot separators near the arc ends -->
  <circle cx="52" cy="100" r="2" fill="#0e7a68"/>
  <circle cx="188" cy="100" r="2" fill="#0e7a68"/>

  <!-- Emblem: open book -->
  <g transform="translate(120,128)">
    <path d="M -46 -6 C -30 -16 -12 -16 0 -6 C 12 -16 30 -16 46 -6 L 46 24 C 30 14 12 14 0 24 C -12 14 -30 14 -46 24 Z"
          fill="#ffffff" stroke="#0a3d36" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-6" x2="0" y2="24" stroke="#0a3d36" stroke-width="2.5"/>
    <path d="M -38 -1 L -8 -1 M -38 7 L -8 7 M -38 15 L -10 15" stroke="#14967f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 8 -1 L 38 -1 M 8 7 L 38 7 M 10 15 L 38 15" stroke="#14967f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Graduation cap above the book -->
    <g transform="translate(0,-44)">
      <polygon points="0,-11 34,0 0,11 -34,0" fill="#0a3d36"/>
      <polygon points="0,-6 20,0 0,6 -20,0" fill="#14967f"/>
      <line x1="20" y1="0" x2="20" y2="16" stroke="#0a3d36" stroke-width="2.5"/>
      <circle cx="20" cy="18" r="3" fill="#0a3d36"/>
    </g>
  </g>
</svg>
